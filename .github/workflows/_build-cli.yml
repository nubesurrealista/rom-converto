name: Build CLI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the caller ref."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the current branch."
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    name: CLI - ${{ matrix.classifier }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: armv7-unknown-linux-musleabihf
            classifier: linux-armv7-musl
            force_cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release -p rom-converto-cli"
          strip: true
          force-use-cross: ${{ matrix.force_cross }}
          # Keep in sync with the image digests in Cross.toml.
          cross-version: v0.2.5
          # Release builds run on main, whose cache scope is separate and
          # evicted between releases; skip the cache there.
          use-rust-cache: true
          # The FFI build reads this cache (same job id and key) and never
          # saves. Cross.toml is hashed so an image bump starts a fresh cache.
          rust-cache-parameters: '{"key":"build-${{ hashFiles(''Cross.toml'') }}","save-if":"${{ github.event_name != ''pull_request'' }}"}'

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail

          exe=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exe=".exe"
          fi

          src="target/${{ matrix.target }}/release/rom-converto${exe}"
          dst="artifact/rom-converto-cli-${{ matrix.classifier }}${exe}"

          mkdir -p artifact
          cp "$src" "$dst"

          sha_cmd="sha256sum"
          if ! command -v sha256sum >/dev/null 2>&1; then
            sha_cmd="shasum -a 256"
          fi
          (cd artifact && $sha_cmd "$(basename "$dst")" > "$(basename "$dst").sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rom-converto-cli-${{ matrix.classifier }}
          path: artifact/
          if-no-files-found: error
